<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Web Games Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 0.95rem;
        }
        
        /* Game Selection Menu Styling */
        .game-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 960px;
            margin-bottom: 20px;
            padding: 12px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            width: 100%;
        }
        .game-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .game-btn:hover {
            background-color: #30363d;
            color: #ffffff;
        }
        .game-btn.active {
            background-color: #2ea043;
            color: #ffffff;
            border-color: #3fb950;
        }

        /* Player Controls Styling */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            max-width: 960px;
            margin-bottom: 12px;
        }
        .current-game-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #58a6ff;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: #2ea043;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #3fb950;
        }
        .btn-secondary {
            background-color: #30363d;
        }
        .btn-secondary:hover {
            background-color: #484f58;
        }

        /* Game Window Styling */
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Locks the game to the full phone/desktop screen until X is clicked */
        .game-wrapper.fullscreen-mode {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
            aspect-ratio: unset !important;
            z-index: 99999 !important;
            border: none !important;
            border-radius: 0 !important;
        }

        iframe {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating 'X' button (hidden until fullscreen is active) */
        .exit-fs-btn {
            display: none;
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100000; /* Always sits above the iframe */
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .exit-fs-btn:hover, .exit-fs-btn:active {
            background-color: #da3633;
            border-color: #ffffff;
        }

        /* Reveal the 'X' button only when in fullscreen mode */
        .game-wrapper.fullscreen-mode .exit-fs-btn {
            display: flex;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Game Arcade</h1>
        <p class="subtitle">Select a game below to start playing</p>
    </header>

    <!-- ================================================================= -->
    <!-- GAME LIST SECTION: Add or remove your game buttons inside this div -->
    <!-- ================================================================= -->
    <div class="game-list">

        <!-- ============================================================= -->
        <!-- [START COPY] Copy everything from here to [END COPY] below    -->
        <!-- to add a new game button to your portal:                      -->
        <!-- 1. Change './slotgame.html' to your new game's file path      -->
        <!-- 2. Change 'Slot Game' (in both places!) to your game name     -->
        <!-- (Note: Remove 'active' from the class on your 2nd/3rd games)  -->
        <!-- ============================================================= -->
        <button class="game-btn active" onclick="loadGame('./slotgame.html', 'Slot Game', this)">
            Slot Game
        </button>
        <!-- [END COPY] ================================================== -->

        <!-- PASTE YOUR NEW GAME BUTTONS RIGHT BELOW THIS LINE -->

    </div>

    <!-- ================================================================= -->
    <!-- PLAYER CONTROLS & EMBEDDED WINDOW                                 -->
    <!-- ================================================================= -->
    <div class="controls">
        <span class="current-game-title" id="game-title">Now Playing: Slot Game</span>
        <div class="action-buttons">
            <button type="button" class="btn" onclick="enterFullscreen()">Fullscreen</button>
            <a class="btn btn-secondary" id="direct-link" href="./slotgame.html" target="_blank">Open Game Directly</a>
        </div>
    </div>

    <div class="game-wrapper" id="game-container">
        <!-- Floating X button to exit fullscreen -->
        <button type="button" class="exit-fs-btn" id="exit-btn" onclick="exitFullscreen()" aria-label="Exit Fullscreen">✕</button>
        
        <!-- FIXED: Changed src from ./game1.html to ./slotgame.html so it loads at launch -->
        <iframe id="game-frame" src="./slotgame.html" allowfullscreen></iframe>
    </div>

    <script>
        // Switches games when you click a button in the list
        function loadGame(gameUrl, gameName, clickedButton) {
            document.getElementById('game-frame').src = gameUrl;
            document.getElementById('direct-link').href = gameUrl;
            document.getElementById('game-title').textContent = 'Now Playing: ' + gameName;

            const allButtons = document.querySelectorAll('.game-btn');
            allButtons.forEach(btn => btn.classList.remove('active'));
            clickedButton.classList.add('active');
        }

        // Enters locked fullscreen when the green "Fullscreen" button is clicked
        function enterFullscreen() {
            const container = document.getElementById('game-container');
            container.classList.add('fullscreen-mode');
            document.body.style.overflow = 'hidden';
        }

        // Exits fullscreen ONLY when the floating 'X' button is clicked/tapped
        function exitFullscreen() {
            const container = document.getElementById('game-container');
            container.classList.remove('fullscreen-mode');
            document.body.style.overflow = '';

            // Fallback in case the browser or iframe triggered native fullscreen
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    </script>

</body>
</html>
